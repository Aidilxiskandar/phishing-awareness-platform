[project]
name = "phishguard"
version = "3.0.0"
description = "Self-hosted phishing simulation & security-awareness platform"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines tolerated in template-adjacent strings
    "B008",  # Form()/Depends() in defaults is the intended FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]       # conftest sets env before importing the app, by design

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/sampledata.py"]

[tool.coverage.report]
# CI fails if coverage drops below this (currently ~93%).
fail_under = 85
