name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One lean job, to keep Actions minutes low.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Test (pytest + coverage)
        run: pytest --cov=app --cov-report=term-missing

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Real-browser smoke test (headless Chrome)
        # Catches bugs only a real browser shows (Origin headers, CSP, JS).
        # ubuntu-latest ships Google Chrome.
        env:
          DATABASE_URL: sqlite:////tmp/smoke.db
          ADMIN_PASSWORD: smoke-test-password
        run: |
          uvicorn app.main:app --port 8765 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8765/health && break; sleep 1; done
          node scripts/browser_smoke.mjs http://127.0.0.1:8765 admin smoke-test-password \
            || (echo "--- server log ---"; tail -50 /tmp/server.log; exit 1)

      - name: Dependency vulnerability scan (pip-audit)
        # Advisory only — reports issues without failing the build.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
