<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · PhishGuard</title>
<style>
  :root{ --bg:#0a0f1c; --surface:#111a2e; --line:#1e2b45; --line-2:#263554;
         --ink:#eaf0fb; --muted:#8a9bbb; --brand:#6366f1; --brand-2:#818cf8;
         --red:#fb7185; --red-soft:rgba(251,113,133,.14); }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#141d33,#0a0f1c);color:var(--ink);}
  .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:30px;box-shadow:0 20px 60px -24px #000;}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:22px;}
  .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 8px 20px -8px var(--brand);}
  .logo svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:2;}
  .name{font-weight:700;font-size:17px;line-height:1.1;}
  .tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  h1{font-size:16px;margin:0 0 4px;}
  p.sub{margin:0 0 20px;color:var(--muted);font-size:13px;}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;}
  input{width:100%;background:#0b1220;border:1px solid var(--line-2);color:var(--ink);
    padding:10px 12px;border-radius:9px;font:inherit;}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(99,102,241,.2);}
  button{width:100%;margin-top:18px;background:linear-gradient(180deg,var(--brand-2),var(--brand));
    color:#fff;border:0;padding:11px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer;}
  button:hover{filter:brightness(1.07);}
  .err{background:var(--red-soft);border:1px solid rgba(251,113,133,.35);color:var(--red);
    padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:6px;}
  .foot{margin-top:18px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5;}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V5l7-3z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <div><div class="name">PhishGuard</div><div class="tag">Awareness Platform</div></div>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Admin access required.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="u">Username</label>
    <input id="u" type="text" name="username" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <input id="p" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="foot">Authorised use only. Run drills on consenting test accounts
      or with written permission.</div>
  </form>
</body>
</html>
